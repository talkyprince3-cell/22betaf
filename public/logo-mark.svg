<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="22betafro">
  <!--
    The wordmark's tile on its own, for the favicon and the console header.
    Squarer and a touch tighter than the lockup so "22" still reads at 16px.
  -->
  <defs>
    <linearGradient id="m" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5252"/>
      <stop offset="1" stop-color="#DD2C44"/>
    </linearGradient>
  </defs>
  <rect width="40" height="40" rx="11" fill="url(#m)"/>
  <text x="20" y="28" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,Segoe UI,Roboto,Arial,sans-serif"
        font-size="21" font-weight="800" letter-spacing="-1.4" fill="#FFFFFF">22</text>
</svg>
